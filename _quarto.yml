project:
  type: website
  title: "The Price of Prestige"
  output-dir: _site

website:
  title: "The Price of Prestige"
  description: "What a Stanford degree is actually worth, from the College Scorecard."
  navbar:
    left:
      - text: "Article"
        file: index.qmd
      - text: "Notebook"
        file: notebooks/notebook.qmd
      - text: "Methods"
        file: docs/methods.qmd
    right:
      - icon: github
        href: https://github.com/aayanahmed20/stanford-daily-price-of-prestige

format:
  html:
    toc: true
    toc-depth: 3
    code-fold: false
    highlight-style: arrow
    theme:
      light:
        - flatly
        - assets/quarto.scss
    include-in-header:
      - text: |
          <style>strong { color: #8C1515; }</style>

execute:
  freeze: auto
