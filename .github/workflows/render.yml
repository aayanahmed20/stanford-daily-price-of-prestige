name: Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: scorecard-raw-v1

      - name: Download raw data
        run: python -m scripts.download

      - name: Validate raw data
        run: python -m scripts.validate

      - name: Preprocess data
        run: python -m scripts.preprocess

      - name: Compute analysis
        run: python -m scripts.analysis

      - name: Render figures
        run: python -m scripts.visualization

      - name: Render site
        run: quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
